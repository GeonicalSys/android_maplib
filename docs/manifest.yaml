schema_version: 1
module_id: maplib
repository_id: maplib
maturity: maintained
last_verified: 2026-08-26
entrypoints:
  - maplib/src/main/java/com/nextgis/maplib/map/MapDrawable.java
  - maplib/src/main/java/com/nextgis/maplib/api/IGISApplication.java
  - maplib/src/main/java/com/nextgis/maplib/datasource/ngw/Connection.java
key_components:
  - path: maplib/build.gradle
    responsibility: Keep release diagnostic VERSION_NAME 3.1.2.18 and debug VERSION_NAME 3.1.2.18 coupled to their consuming application variants, provide the shared JTS topology runtime, and select MapLibre 13.0.2 through the explicit OpenGL artifact without unsupported library build-type version DSL.
  - path: maplib/src/main/java/com/nextgis/maplib/datasource/LayerContentProvider.java
    responsibility: Resolve the live application map for every feature and track ContentProvider operation so in-process project switches cannot retain a stale database.
  - path: maplib/src/main/java/com/nextgis/maplib/map/MapDrawable.java
    responsibility: MapLibre style, sources, layers and raster MBTiles URLs, bounded full-reload feature/style-object cache lifetime, hidden-layer data-reload suppression with on-demand visibility recovery, hot add/reload coordination, lifecycle-safe touch dispatch that rejects events after map/view/host teardown, tap-node and midpoint edit dispatch, active measurement geometry snapshot/restore for ruler Undo/Redo, thicker insertion-direction segment rendering, edit/view unselection primitives used by the app host's terminal successful-save cleanup, deferred cold-walk overlay recovery that waits for edit sources owned by the current style while preserving edit properties and selecting polygon fill strictly by current geometry/layer type, isolated sequential style-property snapshots, post-fill visible-vector source verification, live-style recovery when a previously hidden layer is enabled, topmost location-cursor overlay and null-safe SQLite-to-GeoJSON refresh after cold-restored form Save.
  - path: maplib/src/main/java/com/nextgis/maplib/map/GeometryEditFillPolicy.java
    responsibility: Allow the shared edit fill only for Polygon and MultiPolygon so recovered line sketches cannot inherit polygon rendering state.
  - path: maplib/src/main/java/com/nextgis/maplib/map/MPLFeaturesUtils.java
    responsibility: MapLibre style utilities, explicit polygon-ring closure for editable/draft GeoJSON, rule-style apply/merge hooks, label zoom gate and raster sibling anchor resolution.
  - path: maplib/src/main/java/com/nextgis/maplib/display/FieldStyleRule.java
    responsibility: Rule categories plus other/default style; merge unset optional fields into the effective style at render time.
  - path: maplib/src/main/java/com/nextgis/maplib/map/LayerGroup.java
    responsibility: Maintain bottom-to-top model order, atomically reserve collision-free layer storage, reject a composition save when any child config failed, and insert mixed vector/raster Collector project layers below the top tracks layer.
  - path: maplib/src/main/java/com/nextgis/maplib/map/NGWRasterLayer.java
    responsibility: Persist NGW raster identity, separate extent resource identity and Collector project origin metadata.
  - path: maplib/src/main/java/com/nextgis/maplib/map/NGWVectorLayer.java
    responsibility: Preserve durable NGW/project identity, defer managed 404 decisions to composition sync, apply Collector editability/outbound synchronization policy, send pending edits before remote pull, three-way verify NGW class/geometry/fields against serialized metadata and physical SQLite, repair metadata-only drift without refill, keep server attachment metadata in SQLite without treating absent local bytes as destructive, stream full untracked snapshots from an app-owned disk stage through one SQLite transaction while skipping invalid geometries without deleting their prior local rows, execute incremental pulls as one broadcast-free bulk cache mutation, expose transient pull failures for a deferred retry pass, bind fills to the layer-owning workspace database, validate very large server polygons with bounded-cost topology checks, fingerprint authoritative rebuild requests, and persist bounded failure diagnostics without feature payload.
  - path: maplib/src/main/java/com/nextgis/maplib/util/RemoteAttachmentSyncPolicy.java
    responsibility: Keep metadata-only attachment refresh outside the feature backup gate and compare persisted server metadata without byte-size noise.
  - path: maplib/src/main/java/com/nextgis/maplib/datasource/ngw/SyncAdapter.java
    responsibility: Synchronize account layers in order, own process-wide started/finished state, and retry only transiently failed vector pulls after the main pass without repeating successful layers.
  - path: maplib/src/main/java/com/nextgis/maplib/service/NGWSyncService.java
    responsibility: Host Android account synchronization without blocking the main thread while a worker finishes during service teardown.
  - path: maplib/src/main/java/com/nextgis/maplib/map/VectorLayer.java
    responsibility: Create ordinary local vector layers as editable, load vector configuration, route create/insert/schema/delete operations through the layer-owning workspace database, suppress per-row cache notifications during bulk/rebuild, fail a bulk fill on the first rejected SQL insert, persist server attachment metadata inside the same fill transaction, persist the feature-title field independently from renderer labels, and rebuild the spatial index without persisting partially initialized subclass identity.
  - path: maplib/src/main/java/com/nextgis/maplib/map/Table.java
    responsibility: Persist map and layer JSON through Android AtomicFile so process death restores the previous complete configuration instead of exposing a truncated direct write.
  - path: maplib/src/main/java/com/nextgis/maplib/datasource/GeometryRTree.java
    responsibility: Serialize spatial-index reads and mutations so broadcast receivers, sync workers and cache rebuilds cannot expose partially tightened nodes.
  - path: maplib/src/main/java/com/nextgis/maplib/datasource/GeoEnvelope.java
    responsibility: Keep uninitialized spatial bounds safe for defensive area/dimension calculations.
  - path: maplib/src/main/java/com/nextgis/maplib/map/MapContentProviderHelper.java
    responsibility: Open layers.db beside this map object's own map file and route vector data notifications to the owning layer without allowing one cache callback failure to terminate the Android main thread.
  - path: maplib/src/main/java/com/nextgis/maplib/util/GeoJSONUtil.java
    responsibility: Import local GeoJSON in implicit WGS84, CRS84, common EPSG:4326 aliases or the supported EPSG:3857 path while rejecting other coordinate systems.
  - path: maplib/src/main/java/com/nextgis/maplib/util/DatabaseContext.java
    responsibility: Resolve a layer's owning map through its parent chain, configure bulk-write SQLite PRAGMAs only outside active transactions and return that workspace database to layer importers.
  - path: maplib/src/main/java/com/nextgis/maplib/util/CoordinatePointParser.java
    responsibility: Securely stream standard KML coordinates and GPX waypoint, route-point and track-point coordinates in source order without retaining source topology.
  - path: maplib/src/main/java/com/nextgis/maplib/util/CoordinatePointLayerImporter.java
    responsibility: Convert streamed WGS84 KML/GPX coordinates and available metadata into one editable local point layer using bounded SQLite transactions.
  - path: maplib/src/main/java/com/nextgis/maplib/map/NgwLayerIdentityBackup.java
    responsibility: Encode and validate the last fully initialized NGW vector-layer identity for partial-config recovery.
  - path: maplib/src/main/java/com/nextgis/maplib/map/VectorLayerRenderCache.java
    responsibility: Cache prepared vector rendering payload for map startup.
  - path: maplib/src/main/java/com/nextgis/maplib/map/LocalVectorTileProvider.java
    responsibility: Query and clip local SQLite features into lazy MVT tiles for polygon/multipolygon and read-only simple circle Point layers.
  - path: maplib/src/main/java/com/nextgis/maplib/map/LocalVectorTileServer.java
    responsibility: Serve loopback MVT requests through a bounded two-worker/sixteen-item queue, serialize heavy builds per layer, cancel queued sockets from obsolete map generations and return a retryable overload response instead of exhausting the Android heap.
  - path: maplib/src/main/java/com/nextgis/maplib/map/LocalVectorTileRequestPolicy.java
    responsibility: Define and unit-test local MVT concurrency, queue and minimum 64 MiB heap-headroom limits independently of Android runtime classes.
  - path: maplib/src/main/java/com/nextgis/maplib/map/LocalVectorTileEncoder.java
    responsibility: Encode Point and Polygon MVT command streams plus feature identity and simple label properties.
  - path: maplib/src/main/java/com/nextgis/maplib/map/LayerIdentifyPolicy.java
    responsibility: Include hidden local-vector-tile layers in local attribute identification while continuing to exclude hidden classic layers.
  - path: maplib/src/main/java/com/nextgis/maplib/datasource/ngw/CollectorProjectCompositionSync.java
    responsibility: Compare and apply Collector composition with account-plus-remote-id uniqueness preflight, in-place origin repair and fail-closed conflict handling.
  - path: maplib/src/main/java/com/nextgis/maplib/datasource/ngw/CollectorProjectItem.java
    responsibility: Normalize a supported Collector vector or raster-style item, display state, identity and extent source.
  - path: maplib/src/main/java/com/nextgis/maplib/datasource/ngw/CollectorResource.java
    responsibility: Resolve a complete Collector project snapshot containing vectors and already-supported QGIS styles, and reject incomplete referenced resources.
  - path: maplib/src/main/java/com/nextgis/maplib/map/TMSLayer.java
    responsibility: Safely unpack local tile archives, atomically import one validated raster MBTiles database, and retain immutable NGRc plus duplicate-safe Debug migration provenance.
  - path: maplib/src/main/java/com/nextgis/maplib/util/MbTilesInfo.java
    responsibility: Validate raster MBTiles SQLite structure, integrity, format, zoom range and optional bounds before publication or rendering.
  - path: maplib/src/main/java/com/nextgis/maplib/util/LegacyTileMbtilesMath.java
    responsibility: Convert legacy TMS/OSM rows to standard MBTiles rows and derive deterministic raster format and Web Mercator bounds without Android dependencies.
  - path: maplib/src/main/java/com/nextgis/maplib/util/NGWResourceUrl.java
    responsibility: Parse and normalize a direct NGW resource URL without Android dependencies.
  - path: maplib/src/main/java/com/nextgis/maplib/datasource/ngw/ResourceGroup.java
    responsibility: Load one target NGW resource and resolve QGIS style URLs to their parent layer.
  - path: maplib/src/main/java/com/nextgis/maplib/util/LayerConfigUtil.java
    responsibility: Parse mobile render mode and layer origin configuration.
  - path: maplib/src/main/java/com/nextgis/maplib/util/MultiPolygonGeometryRepair.java
    responsibility: Validate and repair only GeoMultiPolygon topology into one valid multi-part feature, report insufficient ring positions separately, recover an unset collection CRS from nested geometry, and reject empty or non-polygonal repair results.
  - path: maplib/src/main/java/com/nextgis/maplib/util/NgwFeatureGeometryValidator.java
    responsibility: Validate streamed NGW Polygon and MultiPolygon members with JTS instead of the legacy quadratic segment-pair scan while preserving the previous member-by-member collection semantics.
  - path: maplib/src/main/java/com/nextgis/maplib/datasource/GeoGeometryFactory.java
    responsibility: Dispatch WKT geometry to the matching parser, including Polygon and MultiPolygon recovery paths.
  - path: maplib/src/main/java/com/nextgis/maplib/datasource/GeoMultiPolygon.java
    responsibility: Split WKT polygon members by parenthesis depth so multipart geometry, outer rings and real holes survive import and draft recovery.
  - path: maplib/src/main/java/com/nextgis/maplib/map/MLP/PolygonEditClass.java
    responsibility: Build a one-node tap sketch, insert subsequent/midpoint nodes in the selected ring, and retain existing ring structure.
  - path: maplib/src/main/java/com/nextgis/maplib/map/MLP/MultiPolygonEditClass.java
    responsibility: Build one-node tap sketches, display insertion direction inside the selected ring, and limit new MultiPolygon geometry to one polygon part without flattening existing multipart or holed geometry.
  - path: maplib/src/main/java/com/nextgis/maplib/map/MLP/EditDirectionPolicy.java
    responsibility: Resolve the ordered insertion successor without crossing an open line-part boundary, while wrapping a closed polygon ring to its own first vertex.
  - path: maplib/src/main/java/com/nextgis/maplib/util/LocationTrackFilter.java
    responsibility: Adapt Android Location fixes to the shared accuracy-aware track/walk filter, expose basic integrity checks plus safe provider-qualified diagnostics and aggregate counters, make zero input explicitly distinguishable from filtered input, and return accepted fixes without claiming persistence, background-health heartbeat or foreground-service ownership.
  - path: maplib/src/main/java/com/nextgis/maplib/util/LocationUtil.java
    responsibility: Format map measurements, including explicit square-metre to hectare conversion for ruler area labels.
  - path: maplib/src/main/java/com/nextgis/maplib/util/LocationTrackFilterCore.java
    responsibility: Retain valid movement through 160 km/h, reject corrupt fixes and material isolated spikes, and preserve delayed fixes across long sampling gaps without Android test dependencies.
  - path: maplib/src/main/java/com/nextgis/maplib/util/LocationProviderArbiter.java
    responsibility: Adapt Android providers to GPS-first recording while retaining timed network fallback.
  - path: maplib/src/main/java/com/nextgis/maplib/util/LocationProviderArbiterCore.java
    responsibility: Suppress network fixes for 12 seconds after usable GPS and restore network fallback without Android test dependencies.
  - path: maplib/src/main/java/com/nextgis/maplib/util/StakeoutGeometryTarget.java
    responsibility: Index an immutable target and return the nearest boundary point plus WGS84 distance and bearing for repeated stakeout fixes.
  - path: maplib/src/main/java/com/nextgis/maplib/util/StakeoutGuidancePolicy.java
    responsibility: Select distance-based sound bands with outward hysteresis for caller-approved GPS or mock precision fixes without Android dependencies.
  - path: maplib/src/main/java/com/nextgis/maplib/location/GpsEventSource.java
    responsibility: Ordinary location dispatch plus owner-based temporary high-frequency request leases for foreground tools.
public_contracts:
  - id: map-host
    symbol: MaplibreMapInteraction
    path: maplib/src/main/java/com/nextgis/maplib/map/MaplibreMapInteraction.java
    consumers: [app, maplibui]
  - id: gis-application
    symbol: IGISApplication
    path: maplib/src/main/java/com/nextgis/maplib/api/IGISApplication.java
    consumers: [maplibui, app]
  - id: collector-metadata
    symbol: CollectorProjectMetadata
    path: maplib/src/main/java/com/nextgis/maplib/map/CollectorProjectMetadata.java
    consumers: [maplibui, app]
  - id: ngw-resource-url
    symbol: NGWResourceUrl and ResourceGroup.loadTargetResource
    path: maplib/src/main/java/com/nextgis/maplib/util/NGWResourceUrl.java
    consumers: [app, maplibui]
  - id: stakeout-geometry
    symbol: StakeoutGeometryTarget and StakeoutGuidancePolicy
    path: maplib/src/main/java/com/nextgis/maplib/util/StakeoutGeometryTarget.java
    consumers: [app]
settings_refs: [feature_label_field, mobile_render_mode, render_mode, layer_origin, mobile, ngw_identity_backup, ngrc_provenance, legacy_underlay_migration]
storage_contracts:
  - id: layer-json
    path: maplib/src/main/java/com/nextgis/maplib/map/Layer.java
  - id: ngw-raster-layer-json
    path: maplib/src/main/java/com/nextgis/maplib/map/NGWRasterLayer.java
  - id: ngw-vector-identity-backup
    path: maplib/src/main/java/com/nextgis/maplib/map/NgwLayerIdentityBackup.java
  - id: ngw-sync-staged-snapshot
    path: maplib/src/main/java/com/nextgis/maplib/map/NGWVectorLayer.java
invariant_refs: [INV-LAYER-ORDER, INV-TRACK-LAYER-TOP, INV-HOT-ADD-CONSISTENCY, INV-SPATIAL-CACHE-CONSISTENCY, INV-HIDDEN-VECTOR-TILE-IDENTIFY, INV-LOCAL-VECTOR-TILE-RESOURCE-BOUNDS, INV-NO-TRACK-FLAGS, INV-LOCATION-CURSOR-TOP, INV-MAPLIBRE-BACKEND-COMPATIBILITY, INV-MAPLIBRE-VIEW-LIFECYCLE, INV-COLLECTOR-RESOURCE, INV-COLLECTOR-LAYER-IDENTITY, INV-COLLECTOR-RASTER-STYLES, INV-COLLECTOR-ISOLATION, INV-COLLECTOR-EDITABILITY, INV-COLLECTOR-RESUMABLE, INV-COLLECTOR-FORM-ATOMIC, INV-PROJECT-OPERATION-EXCLUSION, INV-NGRC-PRESERVE, INV-LEGACY-UNDERLAY-MIGRATION, INV-SYNC-ACCOUNT-ISOLATION, INV-VERSION-COUPLING, INV-CRASH-DRAFT-RECOVERY, INV-MULTIPOLYGON-REPAIR, INV-GEOMETRY-SKETCH-WORKFLOW, INV-GPS-TRACK-FILTER, INV-STAKEOUT-GUIDANCE, INV-LOCAL-VECTOR-LAYERS]
