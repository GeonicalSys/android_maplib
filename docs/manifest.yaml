schema_version: 1
module_id: maplib
repository_id: maplib
maturity: maintained
last_verified: 2026-09-22
entrypoints:
  - maplib/src/main/java/com/nextgis/maplib/map/MapDrawable.java
  - maplib/src/main/java/com/nextgis/maplib/api/IGISApplication.java
  - maplib/src/main/java/com/nextgis/maplib/datasource/ngw/Connection.java
key_components:
  - path: maplib/src/main/java/com/nextgis/maplib/util/CoalescingRefresh.java
    responsibility: Bound incremental track refresh to one active read and one pending request per kind; release the slot after success, failure or stale UI result.
  - path: maplib/src/main/java/com/nextgis/maplib/datasource/Feature.java
    responsibility: Compare mutable field schemas in linear field traversal without indexed LinkedList scans, preserving name, null, numeric, date and geometry equality semantics.
  - path: maplib/src/main/java/com/nextgis/maplib/util/NgwSyncIo.java
    responsibility: Scope cancellation by sync generation, close active read-only HTTP connections without making remote mutations ambiguous, expose outbound-write state and preserve cancellation through the account adapter.
  - path: maplib/src/main/java/com/nextgis/maplib/util/NgwSyncProgress.java
    responsibility: Session-scoped sync progress from weighted leaf layers and real push/download/apply fractions without inventing remaining work or percent text.
  - path: maplib/src/test/java/com/nextgis/maplib/util/NgwSyncProgressTest.java
    responsibility: Lock session weights, intra-layer push/download hold, deferred retry, monotonic display, cancel and publish throttle.
  - path: maplib/src/main/java/com/nextgis/maplib/util/NgwSyncTrace.java
    responsibility: Log bounded payload-free snapshot attempt, stage, elapsed time and progress.
  - path: maplib/src/main/java/com/nextgis/maplib/util/NgwSnapshotCheckpoint.java
    responsibility: Reuse only committed fully explained missing-invalid counts in the same scope for one hour, with forced recheck support.
  - path: maplib/src/main/java/com/nextgis/maplib/util/SharedUnderlayCatalog.java
    responsibility: Durable asset index, publication and move recovery, format-aware dedup, repair of previously mislinked references and payload lifecycle; Asset.referenceConfig preserves project presentation and zoom limits.
  - path: maplib/src/main/java/com/nextgis/maplib/util/SharedUnderlayStore.java
    responsibility: Stream NGRc/MBTiles into the catalog and report tile or byte import progress without exposing URI or SAF ids.
  - path: maplib/src/main/java/com/nextgis/maplib/util/SharedUnderlayKind.java
    responsibility: Classify NGRc, raster MBTiles and ZIP contents before shared-catalog import without extracting a tile tree.
  - path: maplib/src/main/java/com/nextgis/maplib/util/NgrcArchive.java
    responsibility: Bounded two-pass NGRc reader with complete source hash, tile count for import progress, explicit tile scheme, case-insensitive Mapnik.json/config.json and Mapnik raster-path normalization, and ambiguous metadata rejection.
  - path: maplib/src/main/java/com/nextgis/maplib/util/FileUtil.java
    responsibility: Resolve a human document display name and reject SAF MediaStore ids such as msf:308.
  - path: maplib/src/test/java/com/nextgis/maplib/util/FileUtilDisplayNameTest.java
    responsibility: Lock rejection of empty names and SAF document ids without Android.
  - path: maplib/src/main/java/com/nextgis/maplib/util/RasterMbtilesWriter.java
    responsibility: Shared batched raster database writer for NGRc and Debug streams.
  - path: maplib/src/main/java/com/nextgis/maplib/util/CameraZoom.java
    responsibility: Clamp the MapLibre camera to 7.5 without changing layer DEFAULT_MIN_ZOOM.
  - path: maplib/src/main/java/com/nextgis/maplib/util/UnderlayWorkspaceIndex.java
    responsibility: Closed workspace traversal and unlink without a MapBase singleton.
  - path: maplib/src/main/java/com/nextgis/maplib/map/WalkPreviewGeometry.java
    responsibility: Build a passive walk preview from a private CRS-preserving copy, including incomplete rings and multipart geometry.
  - path: maplib/src/main/java/com/nextgis/maplib/map/UserLocationGeometry.java
    responsibility: Build geodesic accuracy-circle and heading-sector GeoJSON with role properties; cone length is a fixed 8 m independent of GPS accuracy; half-angle is clamped 5–90°.
  - path: maplib/src/main/java/com/nextgis/maplib/util/LocationMotionFilter.java
    responsibility: Separate the fresh display candidate from the recorder stop anchor and expose departure diagnostics.
  - path: maplib/src/test/java/com/nextgis/maplib/util/LocationDepartureTest.java
    responsibility: Verify handheld stationary multipath from anonymized A54 observations, uncertainty-aware departure, early-corner backfill and cancellation/session boundaries.
  - path: maplib/src/main/java/com/nextgis/maplib/location/LocationSubscriptionController.java
    responsibility: Reconcile independent GPS/network requests without GPS removal on screen lifecycle and retain resources until the final recorder leaves.
  - path: maplib/src/main/java/com/nextgis/maplib/location/SensorMotionMonitor.java
    responsibility: Acquire accelerometer evidence for the shared GNSS session without activity-recognition permission.
  - path: maplib/src/main/java/com/nextgis/maplib/util/DeviceMotionEvidence.java
    responsibility: Classify bounded accelerometer windows and look up fresh evidence at GNSS measurement time.
  - path: maplib/src/main/java/com/nextgis/maplib/util/LocationRecordingSamplerCore.java
    responsibility: Buffer tentative GNSS departures per recorder, backfill confirmed movement with original times and corners, and correct one stop vertex without inventing travelled distance.
  - path: maplib/src/main/java/com/nextgis/maplib/map/TrackLayer.java
    responsibility: Store trackpoints.segment in database v6 and expose each track as GeoMultiLineString without connecting gaps.
  - path: maplib/src/main/java/com/nextgis/maplib/util/LocationFixPolicy.java
    responsibility: Monotonic freshness with a one-second future tolerance, optional max-age windows, position validity and GPS-first display (Network only when GPS is absent or stale).
  - path: maplib/src/main/java/com/nextgis/maplib/util/DiagnosticLog.java
    responsibility: Gate verbose GNSS HyperLog dumps on the verbose_log preference without writing coordinates by default.
  - path: maplib/src/main/java/com/nextgis/maplib/util/LocationDiagnosticFormat.java
    responsibility: Format verbose GNSS/stakeout HyperLog lines without Android UI types.
  - path: maplib/src/main/java/com/nextgis/maplib/api/ExternalGnssKeepAliveHost.java
    responsibility: Let the application host start a connected-device foreground service without maplib depending on maplibui.
  - path: maplib/src/main/java/com/nextgis/maplib/util/LocationRecordingSampler.java
    responsibility: Per-recorder time/distance decimation retaining corners, validated final points and one revisable vertex per stop; mock GNSS is sampled no coarser than 2 s / 1 m.
  - path: maplib/src/main/java/com/nextgis/maplib/util/ExternalGnssFixPolicy.java
    responsibility: Keep mock GPS Connector extras exclusive of the 47 m placeholder and phone chip; native NMEA uses the same dense 2 s / 1 m sampling.
  - path: maplib/src/main/java/com/nextgis/maplib/gnss/NmeaParser.java
    responsibility: Talker-agnostic GGA/GST/GSA/RMC and ComNav/NovAtel BESTPOSA parsing with checksum, RTK quality and GST centimetre accuracy.
  - path: maplib/src/main/java/com/nextgis/maplib/gnss/NmeaLineBuffer.java
    responsibility: Assemble $talker+type and #BESTPOS sentences; ignore $/# bytes inside ComNav binary.
  - path: maplib/src/main/java/com/nextgis/maplib/gnss/CnbFrameBuffer.java
    responsibility: Assemble AA 44 12 ComNav frames with NovAtel CRC-32.
  - path: maplib/src/main/java/com/nextgis/maplib/gnss/CnbBestPos.java
    responsibility: Parse BESTPOSB message 42 into WGS84 GnssFix (фикс/плав/авто).
  - path: maplib/src/main/java/com/nextgis/maplib/gnss/ComNavAsciiCommands.java
    responsibility: Optional CRLF log gpgga/gst/gsa/rmc commands, each at most 20 bytes, without unlogall.
  - path: maplib/src/main/java/com/nextgis/maplib/gnss/BluetoothLeTransport.java
    responsibility: Nordic UART notify TX and write RX (6E400002) or writable notify; MTU request; WRITE with response; no arbitrary writable GATT fallback.
  - path: maplib/src/main/java/com/nextgis/maplib/gnss/ExternalGnssSession.java
    responsibility: Own one GNSS transport, parse CNB BESTPOSB first, optionally request ASCII NMEA, reconnect, and publish Location without Mock Location while a configured external endpoint remains selected, independent of map listeners.
  - path: maplib/src/main/java/com/nextgis/maplib/util/AdaptiveLocationFilterCore.java
    responsibility: Platform-independent robust position/velocity filter, stationary anchoring, course-change adaptation and coherent reacquisition.
  - path: maplib/build.gradle
    responsibility: Keep release diagnostic VERSION_NAME 3.1.2.26 and debug VERSION_NAME 3.1.2.22 coupled to their consuming application variants, provide the shared JTS topology runtime, and select MapLibre 13.0.2 through the explicit OpenGL artifact without unsupported library build-type version DSL.
  - path: maplib/src/main/java/com/nextgis/maplib/datasource/LayerContentProvider.java
    responsibility: Resolve the live application map for every feature and track ContentProvider operation so in-process project switches cannot retain a stale database.
  - path: maplib/src/main/java/com/nextgis/maplib/map/MapDrawable.java
    responsibility: MapLibre style, sources, layers and raster MBTiles URLs, solid white Light background color without a repeated texture and preserved neutral/dark patterns, bounded full-reload feature/style-object cache lifetime, hidden-layer data-reload suppression with on-demand visibility recovery, hot add/reload coordination, lifecycle-safe touch dispatch that rejects events after map/view/host teardown, tap-node and midpoint edit dispatch, active measurement geometry snapshot/restore for ruler Undo/Redo, transient azimuth line/start/target overlays restored across full/lite reload below the topmost location cursor with optional endpoint drag callbacks, thicker insertion-direction segment rendering, edit/view unselection primitives used by the app host's terminal successful-save cleanup, deferred cold-walk overlay recovery that waits for edit sources owned by the current style while preserving edit properties and selecting polygon fill strictly by current geometry/layer type, isolated sequential style-property snapshots, post-fill visible-vector source verification, live-style recovery when a previously hidden layer is enabled, topmost location-cursor overlay with metric accuracy fill and heading sector immediately below it, heading-only overlay rebuild from the last GPS fix, and null-safe SQLite-to-GeoJSON refresh after cold-restored form Save.
  - path: maplib/src/main/java/com/nextgis/maplib/map/GeometryEditFillPolicy.java
    responsibility: Allow the shared edit fill only for Polygon and MultiPolygon so recovered line sketches cannot inherit polygon rendering state.
  - path: maplib/src/main/java/com/nextgis/maplib/map/MPLFeaturesUtils.java
    responsibility: MapLibre style utilities, explicit polygon-ring closure for editable/draft GeoJSON, interior polygon and largest usable multipolygon-part label anchors that respect holes, rule-style apply/merge hooks, label zoom gate and raster sibling anchor resolution.
  - path: maplib/src/main/java/com/nextgis/maplib/display/FieldStyleRule.java
    responsibility: Rule categories plus other/default style; merge unset optional fields into the effective style at render time.
  - path: maplib/src/main/java/com/nextgis/maplib/map/LayerGroup.java
    responsibility: Maintain bottom-to-top model order, atomically reserve collision-free layer storage, reject a composition save when any child config failed, and insert mixed vector/raster Collector project layers below the top tracks layer.
  - path: maplib/src/main/java/com/nextgis/maplib/map/NGWRasterLayer.java
    responsibility: Persist NGW raster identity, separate extent resource identity and Collector project origin metadata.
  - path: maplib/src/main/java/com/nextgis/maplib/map/NGWVectorLayer.java
    responsibility: Preserve durable NGW/project identity, defer managed 404 decisions to composition sync, apply Collector editability/outbound synchronization policy, finish only an already-started outbound mutation after cancellation, send pending edits before remote pull, three-way verify NGW class/geometry/fields against serialized metadata and physical SQLite, repair metadata-only drift without refill, keep server attachment metadata in SQLite without treating absent local bytes as destructive, stream full untracked snapshots from an app-owned disk stage through one SQLite transaction while skipping invalid geometries without deleting their prior local rows, execute tracked incremental pulls as one cancellable atomic SQLite transaction and one broadcast-free cache mutation, for SYNC_NONE compare filtered server feature counts with the local table and reload a full snapshot when they differ unless the server reports zero, expose transient pull failures for a deferred retry pass, bind fills to the layer-owning workspace database, validate very large server polygons with bounded-cost topology checks, fingerprint authoritative rebuild requests, and persist bounded failure diagnostics without feature payload.
  - path: maplib/src/main/java/com/nextgis/maplib/util/NgwSyncNoneReloadDecision.java
    responsibility: Pure KEEP/RELOAD policy for SYNC_NONE count comparison; server count <= 0 keeps local data.
  - path: maplib/src/main/java/com/nextgis/maplib/util/NgwFeatureCountParser.java
    responsibility: Parse NGW feature_count JSON; with a where clause use filtered_count only, never unfiltered total_count.
  - path: maplib/src/main/java/com/nextgis/maplib/util/DistrictFilterUtil.java
    responsibility: Opt-in Collector district subset uses NGW fld_district__like=%value% so comma-separated district lists match a project key; SQL LIKE wildcards in the key are escaped.
  - path: maplib/src/main/java/com/nextgis/maplib/util/RemoteAttachmentSyncPolicy.java
    responsibility: Keep metadata-only attachment refresh outside the feature backup gate and compare persisted server metadata without byte-size noise.
  - path: maplib/src/main/java/com/nextgis/maplib/datasource/ngw/SyncAdapter.java
    responsibility: Synchronize account layers in order, own process-wide started/finished state for spinner reconciliation, refresh SYNC_NONE config and count-driven snapshot after the main pass, and retry only transiently failed vector pulls without repeating successful layers.
  - path: maplib/src/main/java/com/nextgis/maplib/service/NGWSyncService.java
    responsibility: Host Android account synchronization without blocking the main thread while a worker finishes during service teardown.
  - path: maplib/src/main/java/com/nextgis/maplib/map/VectorLayer.java
    responsibility: Create ordinary local vector layers as editable, load vector configuration, route create/insert/schema/delete operations through the layer-owning workspace database, suppress per-row cache notifications during bulk/rebuild, fail a bulk fill on the first rejected SQL insert, persist server attachment metadata inside the same fill transaction, persist the feature-title field independently from renderer labels, and rebuild the spatial index without persisting partially initialized subclass identity.
  - path: maplib/src/main/java/com/nextgis/maplib/map/Table.java
    responsibility: Persist map and layer JSON through Android AtomicFile so process death restores the previous complete configuration instead of exposing a truncated direct write.
  - path: maplib/src/main/java/com/nextgis/maplib/datasource/GeometryRTree.java
    responsibility: Serialize spatial-index reads and mutations so broadcast receivers, sync workers and cache rebuilds cannot expose partially tightened nodes.
  - path: maplib/src/main/java/com/nextgis/maplib/datasource/GeoEnvelope.java
    responsibility: Keep uninitialized spatial bounds safe for defensive area/dimension calculations.
  - path: maplib/src/main/java/com/nextgis/maplib/map/MapContentProviderHelper.java
    responsibility: Open layers.db beside this map object's own map file and route vector data notifications to the owning layer without allowing one cache callback failure to terminate the Android main thread.
  - path: maplib/src/main/java/com/nextgis/maplib/util/GeoJSONUtil.java
    responsibility: Import local GeoJSON in implicit WGS84, CRS84, common EPSG:4326 aliases or the supported EPSG:3857 path while rejecting other coordinate systems.
  - path: maplib/src/main/java/com/nextgis/maplib/util/DatabaseContext.java
    responsibility: Resolve a layer's owning map through its parent chain, configure bulk-write SQLite PRAGMAs only outside active transactions and return that workspace database to layer importers.
  - path: maplib/src/main/java/com/nextgis/maplib/util/CoordinatePointParser.java
    responsibility: Securely stream standard KML coordinates and GPX waypoint, route-point and track-point coordinates in source order without retaining source topology.
  - path: maplib/src/main/java/com/nextgis/maplib/util/CoordinatePointLayerImporter.java
    responsibility: Convert streamed WGS84 KML/GPX coordinates and available metadata into one editable local point layer using bounded SQLite transactions.
  - path: maplib/src/main/java/com/nextgis/maplib/map/NgwLayerIdentityBackup.java
    responsibility: Encode and validate the last fully initialized NGW vector-layer identity for partial-config recovery.
  - path: maplib/src/main/java/com/nextgis/maplib/map/VectorLayerRenderCache.java
    responsibility: Cache prepared vector rendering payload for map startup.
  - path: maplib/src/main/java/com/nextgis/maplib/map/LocalVectorTileProvider.java
    responsibility: Query and clip local SQLite features into lazy MVT tiles for polygon/multipolygon and read-only simple circle Point layers.
  - path: maplib/src/main/java/com/nextgis/maplib/map/LocalVectorTileServer.java
    responsibility: Serve loopback MVT requests through a bounded two-worker/sixteen-item queue, serialize heavy builds per layer, cancel queued sockets from obsolete map generations and return a retryable overload response instead of exhausting the Android heap.
  - path: maplib/src/main/java/com/nextgis/maplib/map/LocalVectorTileRequestPolicy.java
    responsibility: Define and unit-test local MVT concurrency, queue and minimum 64 MiB heap-headroom limits independently of Android runtime classes.
  - path: maplib/src/main/java/com/nextgis/maplib/map/LocalVectorTileEncoder.java
    responsibility: Encode Point and Polygon MVT command streams plus feature identity and simple label properties.
  - path: maplib/src/main/java/com/nextgis/maplib/map/LayerIdentifyPolicy.java
    responsibility: Include hidden local-vector-tile layers in local attribute identification while continuing to exclude hidden classic layers.
  - path: maplib/src/main/java/com/nextgis/maplib/datasource/ngw/CollectorProjectCompositionSync.java
    responsibility: Compare and apply Collector composition with account-plus-remote-id uniqueness preflight, in-place origin repair and fail-closed conflict handling.
  - path: maplib/src/main/java/com/nextgis/maplib/datasource/ngw/CollectorProjectItem.java
    responsibility: Normalize a supported Collector vector or raster-style item, display state, identity and extent source.
  - path: maplib/src/main/java/com/nextgis/maplib/datasource/ngw/CollectorResource.java
    responsibility: Resolve a complete Collector project snapshot containing vectors and already-supported QGIS styles, and reject incomplete referenced resources.
  - path: maplib/src/main/java/com/nextgis/maplib/map/TMSLayer.java
    responsibility: Safely unpack local tile archives, atomically import one validated raster MBTiles database, and retain immutable NGRc plus duplicate-safe Debug migration provenance.
  - path: maplib/src/main/java/com/nextgis/maplib/util/MbTilesInfo.java
    responsibility: Validate raster MBTiles SQLite structure, integrity, format, zoom range and optional bounds before publication or rendering.
  - path: maplib/src/main/java/com/nextgis/maplib/util/LegacyTileMbtilesMath.java
    responsibility: Convert legacy TMS/OSM rows to standard MBTiles rows and derive deterministic raster format and Web Mercator bounds without Android dependencies.
  - path: maplib/src/main/java/com/nextgis/maplib/util/LisaCatalog.java
    responsibility: Parse NGW search and children JSON for the shared lisa catalog key and collector_project entries.
  - path: maplib/src/main/java/com/nextgis/maplib/util/LisaCatalogLookup.java
    responsibility: Look up keyname lisa by search then subtree walk and list collector projects under that group.
  - path: maplib/src/main/java/com/nextgis/maplib/datasource/ngw/ResourceGroup.java
    responsibility: Load one target NGW resource and resolve QGIS style URLs to their parent layer.
  - path: maplib/src/main/java/com/nextgis/maplib/util/LayerConfigUtil.java
    responsibility: Parse mobile render mode and layer origin configuration.
  - path: maplib/src/main/java/com/nextgis/maplib/util/MultiPolygonGeometryRepair.java
    responsibility: Validate and repair only GeoMultiPolygon topology into one valid multi-part feature, report insufficient ring positions separately, recover an unset collection CRS from nested geometry, and reject empty or non-polygonal repair results.
  - path: maplib/src/main/java/com/nextgis/maplib/util/NgwFeatureGeometryValidator.java
    responsibility: Validate streamed NGW Polygon and MultiPolygon members with JTS instead of the legacy quadratic segment-pair scan while preserving the previous member-by-member collection semantics.
  - path: maplib/src/main/java/com/nextgis/maplib/datasource/GeoGeometryFactory.java
    responsibility: Dispatch WKT geometry to the matching parser, including Polygon and MultiPolygon recovery paths.
  - path: maplib/src/main/java/com/nextgis/maplib/datasource/GeoMultiPolygon.java
    responsibility: Split WKT polygon members by parenthesis depth so multipart geometry, outer rings and real holes survive import and draft recovery.
  - path: maplib/src/main/java/com/nextgis/maplib/map/MLP/PolygonEditClass.java
    responsibility: Build a one-node tap sketch, insert subsequent/midpoint nodes in the selected ring, and retain existing ring structure.
  - path: maplib/src/main/java/com/nextgis/maplib/map/MLP/MultiPolygonEditClass.java
    responsibility: Build one-node tap sketches, display insertion direction inside the selected ring, and limit new MultiPolygon geometry to one polygon part without flattening existing multipart or holed geometry.
  - path: maplib/src/main/java/com/nextgis/maplib/map/MLP/EditDirectionPolicy.java
    responsibility: Resolve the ordered insertion successor without crossing an open line-part boundary, while wrapping a closed polygon ring to its own first vertex.
  - path: maplib/src/main/java/com/nextgis/maplib/util/LocationTrackFilter.java
    responsibility: Validate GNSS integrity and live batch timestamps, accept mock receiver extras without pedestrian smoothing, adapt the robust motion and delayed sequence filters for the phone chip, and expose accepted display estimates and recording points.
  - path: maplib/src/main/java/com/nextgis/maplib/util/LocationUtil.java
    responsibility: Format map measurements, including explicit square-metre to hectare conversion for ruler area labels.
  - path: maplib/src/main/java/com/nextgis/maplib/util/LocationTrackFilterCore.java
    responsibility: Retain valid movement through 160 km/h, reject corrupt fixes and material isolated spikes, and preserve delayed fixes across long sampling gaps without Android test dependencies.
  - path: maplib/src/main/java/com/nextgis/maplib/util/LocationProviderArbiter.java
    responsibility: Legacy provider-arbitration adapter retained for compatibility; active recording uses GpsEventSource GNSS-only output.
  - path: maplib/src/main/java/com/nextgis/maplib/util/LocationProviderArbiterCore.java
    responsibility: Legacy timed provider arbitration retained for compatibility and its historical tests; not used by track or walk recording.
  - path: maplib/src/main/java/com/nextgis/maplib/util/StakeoutGeometryTarget.java
    responsibility: Index an immutable target and return the nearest boundary point plus WGS84 distance and bearing for repeated stakeout fixes.
  - path: maplib/src/main/java/com/nextgis/maplib/util/StakeoutGuidancePolicy.java
    responsibility: Select distance-based sound bands with outward hysteresis for caller-approved GPS or mock precision fixes without Android dependencies.
  - path: maplib/src/main/java/com/nextgis/maplib/location/GpsEventSource.java
    responsibility: Own application-wide GNSS and display-only network acquisition, GPS-first current-fix expiry, keep-alive external NMEA without map listeners, shared filtered recording including mock receiver extras and native NMEA, original GNSS/mock/NMEA precision subscriptions and owner-based high-frequency leases.
public_contracts:
  - id: asynchronous-track-refresh
    symbol: MapDrawable.reloadCurrentTrackToMap and reloadTrackListToMap
    path: maplib/src/main/java/com/nextgis/maplib/map/MapDrawable.java
    consumers: [app, maplibui]
  - id: passive-walk-preview
    symbol: MapDrawable.showWalkPreview
    path: maplib/src/main/java/com/nextgis/maplib/map/MapDrawable.java
    consumers: [app]
  - id: current-location-recording
    symbol: GpsEventSource.RecordingListener and GpsEventListener.onLocationUnavailable
    path: maplib/src/main/java/com/nextgis/maplib/location/GpsEventSource.java
    consumers: [app, maplibui]
  - id: segmented-tracks
    symbol: TrackLayer.getTracks returns GeoMultiLineString values
    path: maplib/src/main/java/com/nextgis/maplib/map/TrackLayer.java
    consumers: [maplibui]
  - id: map-host
    symbol: MaplibreMapInteraction including transient azimuth endpoint drag callbacks
    path: maplib/src/main/java/com/nextgis/maplib/map/MaplibreMapInteraction.java
    consumers: [app, maplibui]
  - id: gis-application
    symbol: IGISApplication
    path: maplib/src/main/java/com/nextgis/maplib/api/IGISApplication.java
    consumers: [maplibui, app]
  - id: collector-metadata
    symbol: CollectorProjectMetadata
    path: maplib/src/main/java/com/nextgis/maplib/map/CollectorProjectMetadata.java
    consumers: [maplibui, app]
  - id: ngw-resource-url
    symbol: NGWResourceUrl and ResourceGroup.loadTargetResource
    path: maplib/src/main/java/com/nextgis/maplib/util/NGWResourceUrl.java
    consumers: [app, maplibui]
  - id: stakeout-geometry
    symbol: StakeoutGeometryTarget and StakeoutGuidancePolicy
    path: maplib/src/main/java/com/nextgis/maplib/util/StakeoutGeometryTarget.java
    consumers: [app]
settings_refs: [feature_label_field, mobile_render_mode, render_mode, layer_origin, mobile, ngw_identity_backup, ngrc_provenance, legacy_underlay_migration]
storage_contracts:
  - id: ngw-snapshot-count-checkpoint
    path: maplib/src/main/java/com/nextgis/maplib/util/NgwSnapshotCheckpoint.java
  - id: layer-json
    path: maplib/src/main/java/com/nextgis/maplib/map/Layer.java
  - id: ngw-raster-layer-json
    path: maplib/src/main/java/com/nextgis/maplib/map/NGWRasterLayer.java
